<div *ngIf="cargando" class="text-center my-5">
  <div class="spinner-border text-primary" role="status"></div>
  <p class="mt-2">Cargando detalle del laboratorio...</p>
</div>

<!-- Si ya cargó y SÍ existe el laboratorio -->
<div *ngIf="!cargando && laboratorio" class="container mt-4">
  <h2>{{ laboratorio.nombre }}</h2>
  <p>Capacidad: {{ laboratorio.capacidad }}</p>
  <span class="badge" [class.bg-success]="laboratorio.estado === 'disponible'" [class.bg-warning]="laboratorio.estado === 'mantenimiento'">
    {{ laboratorio.estado }}
  </span>
  <br><br>
  <a [routerLink]="['/laboratorios', laboratorio.id, 'editar']" class="btn btn-warning">Editar</a>
  <a routerLink="/laboratorios" class="btn btn-secondary ms-2">Volver</a>
</div>

<!-- Si terminó de cargar pero el ID NO EXISTE en laboratorios -->
<div *ngIf="!cargando && !laboratorio" class="container alert alert-danger my-5 text-center">
  <h4>¡Laboratorio no encontrado!</h4>
  <p>El ID consultado no corresponde a ningún laboratorio registrado en la base de datos.</p>
  <a routerLink="/laboratorios" class="btn btn-primary">Volver a la lista de laboratorios</a>
</div>
